services:
  - type: web
    name: ai-tech-consultant-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn unified_backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/unified-health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TASK1_VECTOR_BACKEND
        value: qdrant
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: claude
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: GROQ_MODEL
        value: mixtral-8x7b-32768
      - key: KB_DAILY_SYNC_TIME
        value: "03:00"
      - key: KB_DAILY_SYNC_TIMEZONE
        value: Asia/Kolkata

  # Streamlit is a separate Render web service because it runs its own HTTP
  # server. All three backend tasks remain on the single API service above.
  - type: web
    name: ai-tech-consultant-ui
    runtime: python
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /
    envVars:
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: ai-tech-consultant-api
          envVarKey: RENDER_EXTERNAL_URL
